name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codecs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        netcdf: ['OFF', 'ON']
        hdf5: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libnetcdf-dev libhdf5-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DEQUILIBRIUM_USE_NETCDF=${{ matrix.netcdf }}
          -DEQUILIBRIUM_USE_HDF5=${{ matrix.hdf5 }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Record and installed-consumer contracts
        run: ctest --test-dir build --output-on-failure --no-tests=error
