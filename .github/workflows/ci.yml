name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codecs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        netcdf: ['OFF', 'ON']
        hdf5: ['OFF', 'ON']
        sanitizers: ['OFF']
        include:
          - netcdf: 'ON'
            hdf5: 'ON'
            sanitizers: 'ON'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libnetcdf-dev libhdf5-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DEQUILIBRIUM_USE_NETCDF=${{ matrix.netcdf }}
          -DEQUILIBRIUM_USE_HDF5=${{ matrix.hdf5 }}
          -DEQUILIBRIUM_SANITIZER_TESTS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Codec, record, and installed-consumer tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Emscripten SDK
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin 5eb0bde7585670252e8ba05e9d361627bffd08b5
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9
      - name: Configure binary-only Wasm
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEQUILIBRIUM_USE_NETCDF=OFF -DEQUILIBRIUM_USE_HDF5=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-sALLOW_MEMORY_GROWTH=1
      - name: Build
        run: cmake --build build --parallel 2
      - name: Binary and checkpoint tests in Node
        run: ctest --test-dir build --output-on-failure --no-tests=error
